<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>📚 Student Task Manager</h1>
            <p>Organize your studies and complete your tasks on time</p>
        </header>

        <!-- Statistics -->
        <div class="stats">
            <div class="stat-box">
                <h2 id="totalTasks">0</h2>
                <p>Total Tasks</p>
            </div>

            <div class="stat-box">
                <h2 id="pendingTasks">0</h2>
                <p>Pending</p>
            </div>

            <div class="stat-box">
                <h2 id="completedTasks">0</h2>
                <p>Completed</p>
            </div>
        </div>

        <!-- Add Task -->
        <section class="task-form">
            <h2>Add New Task</h2>

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <div class="form-row">

                <input
                    type="date"
                    id="taskDate"
                >

                <select id="priority">
                    <option value="High">High Priority</option>
                    <option value="Medium" selected>Medium Priority</option>
                    <option value="Low">Low Priority</option>
                </select>

                <button onclick="addTask()">Add Task</button>

            </div>
        </section>

        <!-- Search and Filter -->
        <section class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search tasks..."
                onkeyup="displayTasks()"
            >

            <select id="filter" onchange="displayTasks()">
                <option value="All">All Tasks</option>
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
            </select>

        </section>

        <!-- Task List -->
        <section>
            <h2 class="list-title">My Tasks</h2>

            <div id="taskList"></div>

            <p id="emptyMessage">
                No tasks available. Add your first task!
            </p>
        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
